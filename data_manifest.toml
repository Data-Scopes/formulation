# Machine-specific: copy to data_manifest.toml and edit tier roots.
# LLM agents: add [datasets.<name>] BEFORE referencing logical_name in code.

# -----------------------------------------------------------------------------
# Policy metadata (optional)
# -----------------------------------------------------------------------------
[manifest]
version = "1.0.0"
project = "formulation"
last_updated = "2026-10-19"

# -----------------------------------------------------------------------------
# Environment base directories (optional)
# -----------------------------------------------------------------------------
# If your manifest omits `[tiers.*]`, `data_io` can derive tier roots from
# `environments.<DATA_ENV>.base_dir`.
#
# Switch with:
#   export DATA_ENV=local
#   export DATA_ENV=researchcloud
[environments.local]
base_dir = "./data"

[environments.researchcloud]
base_dir = "/mnt/shared/data"

[phases]
explore = "jsonl, pkl, xlsx, ad-hoc notebooks"
semi = "jsonl, markdown+yaml frontmatter"
frozen = "parquet (duckdb-queryable)"

# Lean REPUBLIC annotation ES (public diginfra). Override indexes in
# data_manifest.local.toml if the dated snapshot changes.
[elasticsearch]
host = "annotation.republic-caf.diginfra.org"
scheme = "https"
port = 443
url_prefix = "elasticsearch"
resolutions_index = "full_resolutions-2026-03-25"
session_metadata_index = "session_metadata-2026-03-25"
session_text_regions_index = "session_text_regions-2026-03-25"
timeout = 60

# In-repo defaults. Optional drive or full-S4 overrides go in gitignored
# data_manifest.local.toml — do not hardcode /Volumes paths here.
[tiers.hot]
root = "."
mount_check = ""

[tiers.warm]
root = "data/warm"
mount_check = "data/warm"

[tiers.scratch]
root = "./output"
mount_check = ""

[tiers.cold]
root = "data/cold"
mount_check = "data/cold"

# --- datasets: one block per logical name ---
# Track R machine paths (2TB parquet, rc5 xlsx) are absolute overrides in
# gitignored data_manifest.local.toml — do not remount [tiers.warm].
# Formula first-slice names (sample_resolutions, s4_opening_phrase_candidates) land in STEP2.

[datasets.formula_documents]
tier = "hot"
path = "notebooks/formulas/documents.parquet"
phase = "frozen"
description = "Notebook formula matrix (republic_clean): boolean formula-family flags per doc_id; 1705–1796 in current file"
parent = ""

[datasets.resolutions_flat]
tier = "warm"
path = "datasets/republic/resolutions/resolutions_flat.parquet"
phase = "frozen"
description = "One row per resolution with dates (shared REPUBLIC parquet; paragraph_texts + resolutions_text)"
parent = ""

